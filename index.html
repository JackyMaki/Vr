<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hollow Canopy</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#04060a">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #vrbtn {
      position: absolute; right: 16px; bottom: 16px; pointer-events: auto; display: none;
      background: #0d1f16; color: #b7ffcf; border: 2px solid #3fbf7f; border-radius: 10px;
      padding: 12px 20px; font: 700 16px system-ui, sans-serif; letter-spacing: 1px; cursor: pointer;
    }
    #blood { position: absolute; inset: 0; background: radial-gradient(circle, rgba(120,0,0,0) 25%, rgba(90,0,0,.95)); opacity: 0; }
    #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2px 0 0 -2px;
                 border-radius: 50%; background: rgba(255,255,255,.55); }
  </style>
</head>
<body>
  <div id="hud">
    <div id="fade"></div>
    <div id="crosshair"></div>
    <button id="vrbtn">ENTER VR</button>
  </div>
